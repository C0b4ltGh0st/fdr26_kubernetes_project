apiVersion: v1
kind: Namespace
metadata:
  name: snake-arena
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: snake-arena
  namespace: snake-arena
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: snake-arena
  namespace: snake-arena
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - create
  - delete
  - deletecollection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snake-arena
  namespace: snake-arena
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: snake-arena
subjects:
- kind: ServiceAccount
  name: snake-arena
  namespace: snake-arena
---
apiVersion: v1
data:
  MAX_DEATHS: "5"
  MAX_FOOD: "6"
  SNAKE_COUNT: "8"
  START_TIMEOUT_SECONDS: "30"
  TICK_MS: "140"
kind: ConfigMap
metadata:
  name: snake-arena-config-c5fbh67t7b
  namespace: snake-arena
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: snake-arena
    app.kubernetes.io/part-of: snake-pod-arena
  name: snake-arena
  namespace: snake-arena
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: snake-arena
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: snake-arena
    app.kubernetes.io/part-of: snake-pod-arena
  name: snake-arena
  namespace: snake-arena
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: snake-arena
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snake-arena
        app.kubernetes.io/part-of: snake-pod-arena
    spec:
      containers:
      - command:
        - node
        - arena.js
        env:
        - name: ARENA_URL
          value: http://snake-arena
        envFrom:
        - configMapRef:
            name: snake-arena-config-c5fbh67t7b
        image: afkproficoder/snake-pod-arena:latest
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        name: arena
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 3
        resources:
          limits:
            cpu: "1"
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: snake-arena
      terminationGracePeriodSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/name: snake-arena
    app.kubernetes.io/part-of: snake-pod-arena
  name: snake-arena
  namespace: snake-arena
spec:
  ingressClassName: traefik
  rules:
  - host: course-45.network.garden
    http:
      paths:
      - backend:
          service:
            name: snake-arena
            port:
              number: 80
        path: /
        pathType: Prefix