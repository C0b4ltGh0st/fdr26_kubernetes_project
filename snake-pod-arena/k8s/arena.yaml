apiVersion: apps/v1
kind: Deployment
metadata:
  name: snake-arena
  labels:
    app.kubernetes.io/name: snake-arena
    app.kubernetes.io/part-of: snake-pod-arena
spec:
  replicas: 1                 # the game state lives in this one pod, never scale it
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: snake-arena
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snake-arena
        app.kubernetes.io/part-of: snake-pod-arena
    spec:
      serviceAccountName: snake-arena
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: arena
          image: afkproficoder/snake-pod-arena
          imagePullPolicy: Always
          command: ["node", "arena.js"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: snake-arena-config     # generated from .env
          env:
            - name: ARENA_URL                # how snake pods reach the arena
              value: http://snake-arena
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: snake-arena
  labels:
    app.kubernetes.io/name: snake-arena
    app.kubernetes.io/part-of: snake-pod-arena
spec:
  selector:
    app.kubernetes.io/name: snake-arena
  ports:
    - name: http
      port: 80
      targetPort: http
