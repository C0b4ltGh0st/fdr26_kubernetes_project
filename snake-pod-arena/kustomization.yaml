apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: snake-arena

resources:
  - k8s/namespace.yaml
  - k8s/rbac.yaml
  - k8s/arena.yaml
  - k8s/ingress.yaml

# .env -> ConfigMap. The name gets a content hash, so editing .env and
# re-applying rolls out a fresh arena pod automatically.
configMapGenerator:
  - name: snake-arena-config
    envs:
      - .env

# Published image. Snake pods inherit the arena pod's image and pull policy.
images:
  - name: snake-pod-arena
    newName: afkproficoder/snake-pod-arena
    newTag: latest
